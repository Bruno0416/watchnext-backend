      - name: Dar permisos a Maven
        run: chmod +x mvnw
      - name: Instalar root POM
        run: ./mvnw install -N
      - name: Compilar Gateway
        run: ./mvnw -pl gateway -am package

  # 9. Compila Eureka Server (Solo si hubo cambios)
  build-eureka:
    needs: changes
    if: ${{ needs.changes.outputs.eureka == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
