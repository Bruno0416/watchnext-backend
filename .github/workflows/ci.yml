      - name: Dar permisos a Maven
        run: chmod +x mvnw
      - name: Instalar root POM
        run: ./mvnw install -N
      - name: Compilar Eureka Server
        run: ./mvnw -pl eureka-server -am package

  # 10. Compila Search Service (Solo si hubo cambios)
  build-search:
    needs: changes
    if: ${{ needs.changes.outputs.search == 'true' }}
    runs-on: ubuntu-latest
    steps:
