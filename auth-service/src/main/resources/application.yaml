server:
  port: 8081

spring:
  application:
    name: auth-service

  jackson:
      mapper:
        accept-case-insensitive-enums: true

  datasource:
    # fuera de docker usa el mysql de laragon (3306, root sin clave) y crea la base si no existe; docker-compose pasa sus propios datos
    url: jdbc:mysql://${WATCHNEXT_DB_HOST:localhost}:${WATCHNEXT_DB_PORT:3306}/auth_db?createDatabaseIfNotExist=true
    username: ${WATCHNEXT_DB_USER:root}
    password: ${WATCHNEXT_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ---------- migraciones ----------
  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

user-service:
  api:
    base-url: ${USER_SERVICE_INTERNAL_URL:http://user-service:8085/api/v1/users/internal}

# ---------- baja de cuentas desde el panel admin ----------
list-service:
  api:
    base-url: ${LIST_SERVICE_INTERNAL_URL:http://list-service:8083/api/v1/list/internal}

feedback-service:
  api:
    base-url: ${FEEDBACK_SERVICE_INTERNAL_URL:http://feedback-service:8084/api/v1/feedback/internal}

email-service:
  api:
    base-url: http://email-service:8086/api/v1/email/internal

verification:
  code:
    expiration-minutes: 10

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET}
      access-token:
        expiration: ${JWT_ACCESS_EXPIRATION}
      refresh-token:
        expiration: ${JWT_REFRESH_EXPIRATION}
    service-token:
      secret-key: ${SERVICE_JWT_SECRET}
      expiration: 3m
      cache-ttl: 150s

auth:
  oauth:
    google:
      allowed-audiences:
        - ${GOOGLE_WEB_CLIENT_ID}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://admin:${EUREKA_ADMIN_PASSWD}@eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}

# ---------- documentacion swagger ----------
springdoc:
  api-docs:
    path: /api/v1/auth/docs
