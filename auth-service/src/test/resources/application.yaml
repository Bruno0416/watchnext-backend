spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true

eureka:
  client:
    enabled: false

email-service:
  api:
    base-url: http://email-service:9000/email

verification:
  code:
    expiration-minutes: 10

application:
  security:
    jwt:
      secret-key: "clave-secreta-falsa-solo-para-entorno-de-pruebas"
      access-token:
        expiration: 86400000
      refresh-token:
        expiration: 604800000
    service-token:
      secret-key: "clave-secreta-servicio-falsa-para-pruebas"
      expiration: 3m
      cache-ttl: 150s

auth:
  oauth:
    google:
      allowed-audiences:
        - 123456789.googleusercontent.com
