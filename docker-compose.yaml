services:
  # ---- EUREKA SERVER ----
  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    container_name: watch_next_eureka
    ports:
      - "8761:8761"
    networks:
      - watch_next-network
    env_file: .env
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://localhost:8761/actuator/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---- GATEWAY ----
  api-gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      auth-service:
        condition: service_started
      content-service:
        condition: service_started
      list-service:
        condition: service_started
      feedback-service:
        condition: service_started
      user-service:
        condition: service_started
      email-service:
        condition: service_started
      search-service:
        condition: service_started
      eureka-server:
        condition: service_healthy
    env_file: .env
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - watch_next-network

  # ---- AUTH ----
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: watch_next_auth
    env_file: .env
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - watch_next-network

  # ---- CONTENT / TMDB ----
  content-service:
    build:
      context: .
      dockerfile: content-service/Dockerfile
    container_name: watch_next_content
    env_file: .env
    environment:
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY=DEBUG
    depends_on:
      redis:
        condition: service_started
      eureka-server:
        condition: service_healthy
    networks:
      - watch_next-network

  # ---- REDIS (cache para content-service) ----
  redis:
    image: redis:alpine
    container_name: watch_next_redis
    expose:
      - "6379"
    networks:
      - watch_next-network

  # ---- LISTS ----
  list-service:
    build:
      context: .
      dockerfile: list-service/Dockerfile
    container_name: watch_next_list
    env_file: .env
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - watch_next-network

  # ---- FEEDBACK ----
  feedback-service:
    build:
      context: .
      dockerfile: feedback-service/Dockerfile
    container_name: watch_next_feedback
    env_file: .env
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - watch_next-network

  # ---- USER ----
  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: watch_next_user
    env_file: .env
    environment:
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB=TRACE
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - watch_next-network

  # ---- EMAIL ----
  email-service:
    build:
      context: .
      dockerfile: email-service/Dockerfile
    container_name: watch_next_email
    env_file: .env
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - watch_next-network

  # ---- SEARCH ----
  search-service:
    build:
      context: .
      dockerfile: search-service/Dockerfile
    container_name: watch_next_search
    env_file: .env
    depends_on:
      eureka-server:
        condition: service_healthy
      content-service:
        condition: service_started
      user-service:
        condition: service_started
    networks:
      - watch_next-network

networks:
  watch_next-network:
    name: watch_next_shared_network
    driver: bridge
