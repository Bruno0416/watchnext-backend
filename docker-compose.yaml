services:
  # ---- EUREKA SERVER ----
  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    container_name: watch_next_eureka
    ports:
      - "8761:8761"
    networks:
      - watch_next-network
    env_file: .env
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://localhost:8761/actuator/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---- GATEWAY ----
  api-gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      auth-service:
        condition: service_started
      content-service:
        condition: service_started
      list-service:
        condition: service_started
      feedback-service:
        condition: service_started
      user-service:
        condition: service_started
      email-service:
        condition: service_started
      search-service:
        condition: service_started
      news-service:
        condition: service_started
      eureka-server:
        condition: service_healthy
    env_file: .env
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - watch_next-network

  # ---- AUTH ----
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: watch_next_auth
    env_file: .env
    environment:
      - WATCHNEXT_DB_HOST=mysql
      - WATCHNEXT_DB_PORT=3306
      - WATCHNEXT_DB_USER=${WATCHNEXT_DB_USER:-watchnext}
      - WATCHNEXT_DB_PASSWORD=${WATCHNEXT_DB_PASSWORD:-watchnext}
    depends_on:
      eureka-server:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      - watch_next-network

  # ---- CONTENT / TMDB ----
  content-service:
    build:
      context: .
      dockerfile: content-service/Dockerfile
    container_name: watch_next_content
    env_file: .env
    environment:
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY=DEBUG
    depends_on:
      redis:
        condition: service_started
      eureka-server:
        condition: service_healthy
    networks:
      - watch_next-network

  # ---- REDIS (cache para content-service) ----
  redis:
    image: redis:alpine
    container_name: watch_next_redis
    expose:
      - "6379"
    networks:
      - watch_next-network

  # ---- MYSQL (una base por microservicio) ----
  # mysql en docker por si no hay laragon; desde heidisql: 127.0.0.1, puerto 3307, usuario root o watchnext
  mysql:
    image: mysql:8.4
    container_name: watch_next_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${WATCHNEXT_DB_ROOT_PASSWORD:-root}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - watch_next-network

  # ---- DB-INIT (crea las bases y el usuario, igual que en pagoflex) ----
  db-init:
    image: mysql:8.4
    container_name: watch_next_db_init
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_ROOT_PASSWORD: ${WATCHNEXT_DB_ROOT_PASSWORD:-root}
      DB_USER: ${WATCHNEXT_DB_USER:-watchnext}
      DB_PASSWORD: ${WATCHNEXT_DB_PASSWORD:-watchnext}
    volumes:
      - ./db-init/init.sh:/opt/watchnext/init.sh:ro
    # tr quita los \r por si el archivo se clono en windows con CRLF
    entrypoint: ["/bin/bash", "-c", "tr -d '\\r' < /opt/watchnext/init.sh | bash"]
    networks:
      - watch_next-network

  # ---- LISTS ----
  list-service:
    build:
      context: .
      dockerfile: list-service/Dockerfile
    container_name: watch_next_list
    env_file: .env
    environment:
      - WATCHNEXT_DB_HOST=mysql
      - WATCHNEXT_DB_PORT=3306
      - WATCHNEXT_DB_USER=${WATCHNEXT_DB_USER:-watchnext}
      - WATCHNEXT_DB_PASSWORD=${WATCHNEXT_DB_PASSWORD:-watchnext}
    depends_on:
      eureka-server:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      - watch_next-network

  # ---- NEWS ----
  news-service:
    build:
      context: .
      dockerfile: news-service/Dockerfile
    container_name: watch_next_news
    env_file: .env
    environment:
      - WATCHNEXT_DB_HOST=mysql
      - WATCHNEXT_DB_PORT=3306
      - WATCHNEXT_DB_USER=${WATCHNEXT_DB_USER:-watchnext}
      - WATCHNEXT_DB_PASSWORD=${WATCHNEXT_DB_PASSWORD:-watchnext}
    depends_on:
      eureka-server:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      - watch_next-network

  # ---- FEEDBACK ----
  feedback-service:
    build:
      context: .
      dockerfile: feedback-service/Dockerfile
    container_name: watch_next_feedback
    env_file: .env
    environment:
      - WATCHNEXT_DB_HOST=mysql
      - WATCHNEXT_DB_PORT=3306
      - WATCHNEXT_DB_USER=${WATCHNEXT_DB_USER:-watchnext}
      - WATCHNEXT_DB_PASSWORD=${WATCHNEXT_DB_PASSWORD:-watchnext}
    depends_on:
      eureka-server:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      - watch_next-network

  # ---- USER ----
  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: watch_next_user
    env_file: .env
    environment:
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB=TRACE
      - WATCHNEXT_DB_HOST=mysql
      - WATCHNEXT_DB_PORT=3306
      - WATCHNEXT_DB_USER=${WATCHNEXT_DB_USER:-watchnext}
      - WATCHNEXT_DB_PASSWORD=${WATCHNEXT_DB_PASSWORD:-watchnext}
    depends_on:
      eureka-server:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      - watch_next-network

  # ---- EMAIL ----
  email-service:
    build:
      context: .
      dockerfile: email-service/Dockerfile
    container_name: watch_next_email
    env_file: .env
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - watch_next-network

  # ---- SEARCH ----
  search-service:
    build:
      context: .
      dockerfile: search-service/Dockerfile
    container_name: watch_next_search
    env_file: .env
    depends_on:
      eureka-server:
        condition: service_healthy
      content-service:
        condition: service_started
      user-service:
        condition: service_started
    networks:
      - watch_next-network

networks:
  watch_next-network:
    name: watch_next_shared_network
    driver: bridge

volumes:
  mysql-data:
