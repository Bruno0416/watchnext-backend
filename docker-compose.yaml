services:
  # ---- GATEWAY ----
  api-gateway:
    build:
      context: ./gateway
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - content-service
    env_file: .env
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - watch_next-network

  # ---- AUTH ----
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: watch_next_auth
    ports:
      - "8081:8081"
    env_file: .env
    networks:
      - watch_next-network

  # ---- CONTENT / TMDB ----
  content-service:
    build:
      context: .
      dockerfile: content-service/Dockerfile
    container_name: watch_next_content
    ports:
      - "8082:8082"
    env_file: .env
    depends_on:
      - redis
    networks:
      - watch_next-network

  # ---- REDIS (cache para content-service) ----
  redis:
    image: redis:alpine
    container_name: watch_next_redis
    ports:
      - "6379:6379"
    networks:
      - watch_next-network

networks:
  watch_next-network:
    name: watch_next_shared_network
    driver: bridge
