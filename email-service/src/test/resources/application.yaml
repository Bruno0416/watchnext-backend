server:
  port: 8086

spring:
  application:
    name: email-service

  messages:
    basename: messages
    encoding: UTF-8

application:
  security:
    jwt:
      secret-key: "clave-secreta-falsa-solo-para-entorno-de-pruebas"
      access-token:
        expiration: 86400000
    service-token:
      secret-key: "clave-secreta-servicio-falsa-para-pruebas"
      expiration: 3m
      cache-ttl: 150s

resend:
  api:
    base-url: https://api.resend.com
    key: fake-api-key-for-test
  mail:
    from: "fake-domain-for-test"

email:
  rate-limit:
    cooldown-seconds: 60
    max-per-hour: 5

eureka:
  client:
    enabled: false
