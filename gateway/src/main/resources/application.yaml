# yaml-language-server: $schema=none
server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: http://auth-service:8081
              predicates:
                - Path=/api/v1/auth/**
            - id: content-service
              uri: http://content-service:8082
              predicates:
                - Path=/api/v1/content/**
            - id: list-service
              uri: http://list-service:8083
              predicates:
                - Path=/api/v1/list/**

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET}
