server:
  port: 8085

spring:
  application:
    name: user-service

  jackson:
      mapper:
        accept-case-insensitive-enums: true

  data:
    web:
      pageable:
        one-indexed-parameters: true

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

  datasource:
    # fuera de docker usa el mysql de laragon (3306, root sin clave) y crea la base si no existe; docker-compose pasa sus propios datos
    url: jdbc:mysql://${WATCHNEXT_DB_HOST:localhost}:${WATCHNEXT_DB_PORT:3306}/user_db?createDatabaseIfNotExist=true
    username: ${WATCHNEXT_DB_USER:root}
    password: ${WATCHNEXT_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ---------- migraciones ----------
  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET}
    service-token:
      secret-key: ${SERVICE_JWT_SECRET}
      expiration: 3m
      cache-ttl: 150s

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://admin:${EUREKA_ADMIN_PASSWD}@eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}

cloudinary:
  url: ${CLOUDINARY_URL}

content-service:
  api:
    base-url: ${CONTENT_SERVICE_BASE_URL:http://content-service:8082/api/v1/content/internal}

app:
  profile:
    favorites:
      max-size: 5

# ---------- documentacion swagger ----------
springdoc:
  api-docs:
    path: /api/v1/users/docs
